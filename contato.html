<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>Entre em contato</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Envie sua mensagem</h2>

            <p>
                Tem alguma dúvida ou quer compartilhar sua opinião
                sobre a série? Preencha o formulário.
            </p>

            <form action="">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome"
                       placeholder="Digite seu nome" required>

                <br><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email"
                       placeholder="seuemail@exemplo.com" required>

                <br><br>

                <label for="assunto">Assunto:</label>
                <input type="text" id="assunto" name="assunto"
                       placeholder="Digite o assunto" required>
               <br><br>
                <p>Categoria:</p>
                <input type="checkbox" id="duvida" name="categoria" value="Dúvida">
                <label for="duvida">Dúvida</label>

                <input type="checkbox" id="sugestao" name="categoria" value="Sugestão"> <label for="sugestao">Sugestão</label>

                <input type="checkbox" id="elogio" name="categoria" value="Elogio"> <label for="elogio">Elogio</label>

                <input type="checkbox" id="outro" name="categoria" value="Outro"> <label for="outro">Outro</label>

                <br><br>

                <label for="comentario">Comentário:</label>
                <br>
                <textarea id="comentario" name="comentario"
                          rows="5" cols="40"
                          placeholder="Escreva sua mensagem"
                          required></textarea>

                <br><br>

                <button type="submit">Enviar mensagem</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Conhecendo Anne with an E</p>
    </footer>
</body>
</html>
